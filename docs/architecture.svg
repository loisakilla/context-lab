<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Схема Context Lab: исходники библиотеки и реестр правил превращаются в индекс, документацию и MCP-сервер, которые питают режимы контекста, а результат проверяют компилятор и линтер">
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f5f2e9; }
    .card { fill: #ffffff; stroke: #ddd6c4; stroke-width: 2; }
    .accent { fill: #ede7ff; stroke: #7747d4; stroke-width: 2; }
    .check { fill: #e9f7ec; stroke: #1f9d55; stroke-width: 2; }
    .t { fill: #1a1726; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 14px; }
    .h { fill: #1a1726; font-family: 'Fraunces', Georgia, serif; font-size: 15px; font-weight: 700; }
    .s { fill: #4a4258; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 12px; }
    .arrow { stroke: #7a7187; stroke-width: 2; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0c0a14; }
      .card { fill: #15121f; stroke: #221c30; }
      .accent { fill: #1e1633; stroke: #c9a3ff; }
      .check { fill: #10231a; stroke: #6bd97a; }
      .t, .h { fill: #f0ecf5; }
      .s { fill: #a59cb8; }
      .arrow { stroke: #6e6386; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7187" />
    </marker>
  </defs>
  <rect class="bg" width="880" height="430" rx="8" />

  <rect class="card" x="20" y="40" width="190" height="86" rx="6" />
  <text class="h" x="36" y="66">Исходники Jinx UI</text>
  <text class="s" x="36" y="88">38 компонентов, .tsx</text>
  <text class="s" x="36" y="106">токены в CSS, описания в .md</text>

  <rect class="card" x="20" y="158" width="190" height="86" rx="6" />
  <text class="h" x="36" y="184">Реестр правил</text>
  <text class="s" x="36" y="206">rules/: org → jinx-ui</text>
  <text class="s" x="36" y="224">наследование, приоритеты</text>

  <rect class="accent" x="266" y="40" width="200" height="86" rx="6" />
  <text class="h" x="282" y="66">docgen</text>
  <text class="s" x="282" y="88">TypeScript Compiler API:</text>
  <text class="s" x="282" y="106">пропсы, union, наследование</text>

  <rect class="accent" x="266" y="158" width="200" height="86" rx="6" />
  <text class="h" x="282" y="184">rules</text>
  <text class="s" x="282" y="206">резолвер с провенансом,</text>
  <text class="s" x="282" y="224">компиляция и линт</text>

  <rect class="card" x="266" y="276" width="200" height="86" rx="6" />
  <text class="h" x="282" y="302">docs + mcp</text>
  <text class="s" x="282" y="324">llms.txt, документы,</text>
  <text class="s" x="282" y="342">MCP-сервер по stdio</text>

  <rect class="card" x="522" y="96" width="150" height="200" rx="6" />
  <text class="h" x="538" y="122">Режимы</text>
  <text class="t" x="538" y="150">без контекста</text>
  <text class="t" x="538" y="176">README</text>
  <text class="t" x="538" y="202">доки</text>
  <text class="t" x="538" y="228">доки + правила</text>
  <text class="t" x="538" y="254">MCP</text>
  <text class="s" x="538" y="278">одна задача, одна модель</text>

  <rect class="check" x="712" y="40" width="148" height="112" rx="6" />
  <text class="h" x="728" y="66">Проверки</text>
  <text class="s" x="728" y="88">tsc: выдуманные</text>
  <text class="s" x="728" y="106">компоненты и пропсы</text>
  <text class="s" x="728" y="124">линтер: токены, innerHTML</text>
  <text class="s" x="728" y="142">рендер в iframe</text>

  <rect class="card" x="712" y="184" width="148" height="112" rx="6" />
  <text class="h" x="728" y="210">Запись прогона</text>
  <text class="s" x="728" y="232">токены и стоимость</text>
  <text class="s" x="728" y="250">вызовы инструментов</text>
  <text class="s" x="728" y="268">вердикт и покрытие</text>
  <text class="s" x="728" y="286">матрица задача × режим</text>

  <path class="arrow" d="M 210 83 L 260 83" />
  <path class="arrow" d="M 210 201 L 260 201" />
  <path class="arrow" d="M 366 126 L 366 152" />
  <path class="arrow" d="M 366 244 L 366 270" />
  <path class="arrow" d="M 466 100 C 500 100 500 150 516 165" />
  <path class="arrow" d="M 466 310 C 500 310 500 240 516 226" />
  <path class="arrow" d="M 672 150 C 692 150 696 120 706 106" />
  <path class="arrow" d="M 672 240 L 706 240" />
</svg>
